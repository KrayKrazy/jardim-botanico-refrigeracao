<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D082" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8F6E28" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14345A" />
      <stop offset="100%" stop-color="#071527" />
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0091FF" />
    </linearGradient>
    <filter id="primeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brasão Nobre Jardim Botânico -->
  <g transform="translate(10, 10)">
    <!-- Escudo -->
    <path d="M50 0 L90 18 L90 62 C90 85 50 98 50 98 C50 98 10 85 10 62 L10 18 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Floco de Neve Técnico & Silhueta Orvalho -->
    <line x1="50" y1="18" x2="50" y2="78" stroke="url(#iceGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="26" x2="42" y2="34" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="26" x2="58" y2="34" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="70" x2="42" y2="62" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="70" x2="58" y2="62" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

    <line x1="24" y1="34" x2="76" y2="64" stroke="url(#iceGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="64" x2="76" y2="34" stroke="url(#iceGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Núcleo -->
    <circle cx="50" cy="49" r="6.5" fill="#FFFFFF" />
    <circle cx="50" cy="49" r="3.5" fill="#C5A059" />
  </g>

  <!-- Tipografia Oficial -->
  <text x="120" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="27" fill="#0A2540" letter-spacing="-0.3">
    JARDIM BOTÂNICO
  </text>
  <text x="390" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="27" fill="#C5A059" letter-spacing="-0.3">
    PRIME
  </text>
  <text x="122" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12.5" fill="#5A6E85" letter-spacing="3.2">
    REFRIGERAÇÃO &amp; LINHA BRANCA EM CONDOMÍNIOS
  </text>
</svg>
